name: BTC Price Alert

on:
  schedule:
    - cron: '*/15 * * * *'   # every 15 min — GitHub's min interval is 5 min
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab too

permissions:
  contents: write

jobs:
  check-btc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Run BTC alert check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/btc_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/btc_alert_state.json
          git diff --cached --quiet || git commit -m "Update BTC alert state [skip ci]"
          git push